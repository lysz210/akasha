---
# ==========================================
# PHASE 1: System Prep & Docker Installation
# ==========================================
- name: Prepare Pis and Install Docker
  hosts: managers
  become: yes

  pre_tasks:
    - name: Initialize system
      include_role:
        name: system_init

  roles:
    - role: akasha_cloud
    - role: hou_yi
    - role: capacnan
    - role: claviger
    - role: ruwaat_intervals

  post_tasks:
    - name: Run a complete Docker system prune
      community.docker.docker_prune:
        containers: true
        networks: true
        images: true
        builder_cache: true
        images_filters:
          dangling: false  # False ensures ALL unused images are wiped, not just tagged ones